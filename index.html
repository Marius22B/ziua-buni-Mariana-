<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La mulți ani, bunica Mariana! ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffb6d5, #ffd9ec, #fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.card {
    width: 92%;
    max-width: 700px;
    padding: 30px;
    text-align: center;
    background: rgba(255,255,255,0.95);
    border-radius: 35px;
    box-shadow: 0 15px 50px rgba(150,40,90,.3);
}

h1 {
    color: #d63384;
    font-size: 50px;
    margin: 10px;
}

h2 {
    color: #b02a68;
}

p {
    color: #63394e;
    font-size: 19px;
    line-height: 1.6;
}

/* GALERIE */
.galerie {
    position: relative;
    width: 100%;
    height: 400px;
    margin: 25px 0;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.poza {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease;
}

.poza.activa {
    opacity: 1;
}

button {
    border: none;
    background: linear-gradient(45deg, #d63384, #ff4fa3);
    color: white;
    padding: 15px 28px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
}

#surpriza {
    display: none;
    animation: aparitie 1s ease;
}

@keyframes aparitie {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.inima {
    font-size: 55px;
    animation: bate 1s infinite;
}

@keyframes bate {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}
</style>
</head>

<body>

<div class="card">

    <div class="inima">❤️</div>

    <h1>La mulți ani!</h1>

    <h2>Draga mea bunică Mariana! 🌷</h2>

    <!-- POZELE -->
    <div class="galerie">

        <img src="poza1.jpg" class="poza activa">
        <img src="poza2.jpg" class="poza">
        <img src="poza3.jpg" class="poza">
        <img src="poza4.jpg" class="poza">
        <img src="poza5.jpg" class="poza">

    </div>

    <p>
        ❤️ Pentru cea mai minunată bunică! ❤️
    </p>

    <p>
        Îți doresc multă sănătate, fericire și
        cât mai multe momente frumoase!
    </p>

    <button onclick="surpriza()">
        🎁 Apasă pentru surpriză
    </button>

    <div id="surpriza">

        <h2>🎉 SURPRIZĂ! 🎉</h2>

        <p>
            Te iubesc foarte mult, bunica Mariana! ❤️
            <br><br>
            Ești cea mai bună bunică din lume! 🥰
        </p>

        <div style="font-size:45px;">
            🌹 🌸 💐 🌷 ❤️ 🌷 💐 🌸 🌹
        </div>

    </div>

</div>


<script>

// SLIDESHOW CU POZE

let poze = document.querySelectorAll(".poza");
let index = 0;

setInterval(function() {

    poze[index].classList.remove("activa");

    index++;

    if (index >= poze.length) {
        index = 0;
    }

    poze[index].classList.add("activa");

}, 3000);


// BUTON SURPRIZĂ

function surpriza() {

    document.getElementById("surpriza").style.display = "block";

    // Confetti
    for(let i = 0; i < 60; i++) {

        let confetti = document.createElement("div");

        confetti.innerHTML = ["🎉","❤️","✨","🌸","💖"][
            Math.floor(Math.random() * 5)
        ];

        confetti.style.position = "fixed";
        confetti.style.top = "-20px";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.fontSize = "25px";
        confetti.style.zIndex = "10";

        document.body.appendChild(confetti);

        let durata = Math.random() * 3 + 2;

        confetti.animate(
            [
                { transform: "translateY(0) rotate(0deg)" },
                { transform: "translateY(110vh) rotate(720deg)" }
            ],
            {
                duration: durata * 1000,
                easing: "linear"
            }
        );

        setTimeout(() => {
            confetti.remove();
        }, durata * 1000);
    }
}

</script>

</body>
</html>
